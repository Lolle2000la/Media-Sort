name: Automated Release Distribution

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # This workflow is tag-driven, and the tag name is what Velopack uses as the
  # package version -- but the version baked into the binary (the About dialog
  # and the updater's prerelease detection, via env!("CARGO_PKG_VERSION")) comes
  # from [workspace.package].version in Cargo.toml, and the OS-facing versions
  # live in Info.plist (macOS) and media-sort-gui.rc (Windows). All of them are
  # written by scripts/release.sh, so refuse to build a tag that disagrees with
  # any of them rather than publish artifacts that report the wrong version.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build-number check below counts every v* tag, so the full tag
          # set must be present (fetch-depth: 0 fetches all history and tags).
          fetch-depth: 0

      - name: Verify Tag Matches Version Files
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          MANIFEST_VERSION="$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && /^version[[:space:]]*=/ { gsub(/^[^"]*"|".*$/, ""); print; exit }
          ' Cargo.toml)"
          [ -n "$MANIFEST_VERSION" ] || { echo "::error::could not read [workspace.package].version from Cargo.toml"; exit 1; }

          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match the workspace version '$MANIFEST_VERSION' in Cargo.toml. Run scripts/release.sh $TAG_VERSION to bump and tag in one step."
            exit 1
          fi

          LOCK_VERSION="$(grep -A1 '^name = "media-sort-gui"$' Cargo.lock | grep '^version = ' | head -n 1 | cut -d'"' -f2)"
          if [ "$LOCK_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Cargo.lock has media-sort-gui $LOCK_VERSION but Cargo.toml declares $MANIFEST_VERSION; run 'cargo update --workspace' and commit the lock file."
            exit 1
          fi

          # Apple's CFBundleShortVersionString is 1-3 period-separated integers.
          MARKETING_VERSION="${TAG_VERSION%%-*}"
          MARKETING_VERSION="${MARKETING_VERSION%%+*}"

          PLIST_SHORT="$(sed -n '/<key>CFBundleShortVersionString<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' packaging/macos/Info.plist)"
          if [ "$PLIST_SHORT" != "$MARKETING_VERSION" ]; then
            echo "::error::Info.plist CFBundleShortVersionString is '$PLIST_SHORT' but the tag implies '$MARKETING_VERSION'; run scripts/release.sh to sync it."
            exit 1
          fi

          # The list below includes this tag, so the count equals the 1-based
          # release ordinal that scripts/release.sh wrote.
          EXPECTED_BUILD="$(git tag -l 'v*' | wc -l | tr -d '[:space:]')"
          PLIST_BUILD="$(sed -n '/<key>CFBundleVersion<\/key>/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' packaging/macos/Info.plist)"
          if [ "$PLIST_BUILD" != "$EXPECTED_BUILD" ]; then
            echo "::error::Info.plist CFBundleVersion is '$PLIST_BUILD' but this is release #$EXPECTED_BUILD; run scripts/release.sh to sync it."
            exit 1
          fi

          RC_VERSION="$(sed -n 's/.*VALUE "ProductVersion", "\([^"]*\)".*/\1/p' crates/media-sort-gui/media-sort-gui.rc | head -n 1)"
          if [ "$RC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::media-sort-gui.rc ProductVersion is '$RC_VERSION' but the tag is '$TAG_VERSION'; run scripts/release.sh to sync it."
            exit 1
          fi

          echo "Tag $GITHUB_REF_NAME matches Cargo.toml/Cargo.lock $MANIFEST_VERSION, Info.plist $PLIST_SHORT (build $PLIST_BUILD) and media-sort-gui.rc $RC_VERSION"

  deploy:
    needs: verify-version
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      matrix:
        include:
          # Windows Releases
          - os: windows-latest
            platform: win-x64
            target: x86_64-pc-windows-msvc
            exe_name: media-sort-gui.exe
            mpv_arch: x86_64
            vcredist: vcredist143-x64
            msvc_arch: x64
          - os: windows-11-arm
            platform: win-arm64
            target: aarch64-pc-windows-msvc
            exe_name: media-sort-gui.exe
            mpv_arch: aarch64
            vcredist: vcredist143-arm64
            msvc_arch: arm64

          # Linux Releases
          - os: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            exe_name: media-sort-gui
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            exe_name: media-sort-gui

          # macOS Releases
          - os: macos-latest
            platform: osx-arm64
            target: aarch64-apple-darwin
            exe_name: media-sort-gui
            brew_prefix: /opt/homebrew

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust Environment
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Setup .NET SDK (For vpk CLI)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install System Dependencies (Linux Only)
        if: startsWith(matrix.os, 'ubuntu')
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            sudo apt-get update
            sudo apt-get install -y libmpv-dev libasound2-dev libdav1d-dev squashfs-tools
            if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
              sudo apt-get install -y nasm
            fi

      - name: Install System Dependencies (macOS Only)
        if: startsWith(matrix.os, 'macos')
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            brew install mpv ffmpeg dylibbundler dav1d
            echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Setup libmpv Link Libraries (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          # gh refuses to run without a token in Actions contexts; the
          # runner does not inject GH_TOKEN into action processes, only
          # run steps that reference github.token explicitly get one.
          GH_TOKEN: ${{ github.token }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          shell: bash
          command: |
            # nick-fields/retry@v4 spawns the command without set -e, so
            # failures would otherwise be swallowed and the step would
            # "succeed" with garbage artifacts; be explicit.
            set -euo pipefail
            # nick-fields/retry@v4 runs `command` in a different working
            # directory than GITHUB_WORKSPACE (it cannot honor
            # working-directory), so all paths must be absolute -- a
            # relative "libs" would not be found by the linker's
            # "/LIBPATH:libs" at build time.
            mkdir -p "$GITHUB_WORKSPACE/libs"
            # zhongfly/mpv-winbuild publishes a fresh build roughly daily but
            # retains only the last 30 days, so resolve the latest tag at
            # runtime instead of pinning one that would be pruned.
            RELEASE_SPEC="$(gh release view --repo zhongfly/mpv-winbuild --json tagName --jq .tagName)"
            [ -n "$RELEASE_SPEC" ] || { echo "::error::could not resolve mpv-winbuild release"; exit 1; }
            MPV_ASSET=$(gh release view "$RELEASE_SPEC" --repo zhongfly/mpv-winbuild --json assets --jq '.assets[].name | select(startswith("mpv-dev-${{ matrix.mpv_arch }}") and endswith(".7z") and (contains("-lgpl") | not) and (contains("-v3") | not))' | head -n 1)
            FFMPEG_ASSET=$(gh release view "$RELEASE_SPEC" --repo zhongfly/mpv-winbuild --json assets --jq '.assets[].name | select(startswith("ffmpeg-${{ matrix.mpv_arch }}") and endswith(".7z") and (contains("-lgpl") | not) and (contains("-v3") | not))' | head -n 1)
            [ -n "$MPV_ASSET" ] || { echo "::error::no mpv-dev-${{ matrix.mpv_arch }} asset in release $RELEASE_SPEC"; exit 1; }
            [ -n "$FFMPEG_ASSET" ] || { echo "::error::no ffmpeg-${{ matrix.mpv_arch }} asset in release $RELEASE_SPEC"; exit 1; }
            curl -fL -o mpv-dev.7z "https://github.com/zhongfly/mpv-winbuild/releases/download/$RELEASE_SPEC/$MPV_ASSET"
            curl -fL -o ffmpeg.7z "https://github.com/zhongfly/mpv-winbuild/releases/download/$RELEASE_SPEC/$FFMPEG_ASSET"
            7z e mpv-dev.7z libmpv-2.dll "-o$GITHUB_WORKSPACE/libs" -y
            7z e mpv-dev.7z libmpv.dll.a "-o$GITHUB_WORKSPACE/libs" -y
            mv "$GITHUB_WORKSPACE/libs/libmpv.dll.a" "$GITHUB_WORKSPACE/libs/mpv.lib"
            7z e ffmpeg.7z ffmpeg.exe "-o$GITHUB_WORKSPACE/libs" -y

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: startsWith(matrix.os, 'windows')
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Setup dav1d/libjpeg-turbo Build Tools (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          shell: bash
          command: |
            pip install meson ninja
            if [ "${{ matrix.target }}" != "aarch64-pc-windows-msvc" ]; then
              choco install -y nasm
            fi
            choco install -y pkgconfiglite
            # system-deps defaults BUILD_INTERNAL to "never" and hard-fails
            # when pkg-config is absent (always on Windows runners); force
            # the vendored meson build instead.
            echo "SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always" >> "$GITHUB_ENV"
            # On aarch64-pc-windows-msvc, build dav1d with clang-cl instead of
            # cl: dav1d's meson needs gas-preprocessor.pl for MSVC ARM64 asm
            # (not installed), but skips that path when cc.get_id() ==
            # 'clang-cl' (meson >= 0.58), using clang's integrated assembler
            # for the .S files. clang-cl ships in the runner's bundled LLVM.
            if [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ]; then
              echo "CC=clang-cl" >> "$GITHUB_ENV"
              echo "CXX=clang-cl" >> "$GITHUB_ENV"
            fi

      # SECURITY: never add actions/cache (or any cache restore) to this
      # workflow. Cache archives are unsigned and writable from branches; a
      # poisoned cache restored before this build could put attacker-controlled
      # artifacts into the binaries that are later GPG-signed and published.
      # Releases are always built from the checked-out source with no cache in
      # the loop. Non-release CI caches live in ci.yml under a trusted-write
      # policy.
      - name: Build Standalone Binary
        env:
          LIBRARY_PATH: ${{ startsWith(matrix.os, 'macos') && format('{0}/lib', matrix.brew_prefix) || '' }}
          # The NODEFAULTLIB flags mirror .cargo/config.toml (see there for
          # the full rationale): RUSTFLAGS here REPLACES config rustflags,
          # and the vendored libjpeg-turbo's static MSVC CRT would otherwise
          # warn LNK4098 on every Windows link.
          RUSTFLAGS: ${{ startsWith(matrix.os, 'windows') && '-L native=libs -C link-arg=/NODEFAULTLIB:LIBCMTD -C link-arg=/NODEFAULTLIB:LIBCMT' || '' }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }} -p media-sort-gui --features velopack

      - name: Install and Run Velopack Packager
        shell: bash
        run: |
          dotnet tool install -g vpk
          export PATH="$PATH:$HOME/.dotnet/tools"
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

          RAW_VERSION="${{ github.ref_name }}"
          CLEAN_VERSION="${RAW_VERSION#v}"

          DOWNLOAD_FLAGS=""
          if [[ "$RAW_VERSION" == *"-"* ]]; then
            DOWNLOAD_FLAGS="--pre"
          fi

          vpk download github --repoUrl https://github.com/${{ github.repository }} --channel ${{ matrix.platform }} --token ${{ secrets.GITHUB_TOKEN }} $DOWNLOAD_FLAGS

          TARGET_DIR="target/${{ matrix.target }}/release"
          mkdir dist

          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            mkdir -p "dist/Media Sort.app/Contents/MacOS"
            mkdir -p "dist/Media Sort.app/Contents/Resources"
            cp "$TARGET_DIR/media-sort-gui" "dist/Media Sort.app/Contents/MacOS/"
            cp packaging/macos/Info.plist "dist/Media Sort.app/Contents/"
            cp packaging/macos/icon.icns "dist/Media Sort.app/Contents/Resources/"
            cp "${{ matrix.brew_prefix }}/bin/ffmpeg" "dist/Media Sort.app/Contents/MacOS/ffmpeg"

            dylibbundler -od -b -x "dist/Media Sort.app/Contents/MacOS/media-sort-gui" -x "dist/Media Sort.app/Contents/MacOS/ffmpeg" -d "dist/Media Sort.app/Contents/libs/" -s ${{ matrix.brew_prefix }}/lib

            vpk pack -u MediaSort -v "$CLEAN_VERSION" -p "dist/Media Sort.app" --mainExe media-sort-gui --icon "packaging/macos/icon.icns" --channel ${{ matrix.platform }} --runtime ${{ matrix.platform }}
          elif [ "${{ matrix.os }}" = "windows-latest" ] || [ "${{ matrix.os }}" = "windows-11-arm" ]; then
            cp "$TARGET_DIR/media-sort-gui.exe" dist/
            cp libs/libmpv-2.dll dist/
            cp libs/ffmpeg.exe dist/
            cp packaging/windows/icon.ico dist/

            vpk pack -u MediaSort -v "$CLEAN_VERSION" -p dist -e ${{ matrix.exe_name }} --icon "dist/icon.ico" --channel ${{ matrix.platform }} --runtime ${{ matrix.platform }} --framework ${{ matrix.vcredist }}
          else
            # Stage only the compiled binary to prevent bundling Cargo build cache
            mkdir -p dist/linux-staging
            cp "$TARGET_DIR/media-sort-gui" dist/linux-staging/

            # Generate initial layout with default update manifests
            vpk pack -u MediaSort -v "$CLEAN_VERSION" -p "dist/linux-staging" -e media-sort-gui --icon "packaging/linux/icon.svg" --channel ${{ matrix.platform }} --runtime ${{ matrix.platform }}

            # Unpack the intermediate AppImage artifact
            APPIMAGE_PATH=$(ls Releases/*.AppImage | head -n 1)
            chmod +x "$APPIMAGE_PATH"
            "$APPIMAGE_PATH" --appimage-extract
            
            # Purge baseline outputs to prevent circular duplication
            rm -f Releases/*.AppImage
            rm -f Releases/*.nupkg

            # Surgically modify vpk-generated desktop file (preserves vendor metadata)
            TARGET_DESKTOP="squashfs-root/MediaSort.desktop"
            sed -i 's/^Name=.*/Name=Media Sort/' "$TARGET_DESKTOP"
            sed -i 's/^Exec=.*/& %U/' "$TARGET_DESKTOP"
            sed -i 's/^StartupWMClass=.*/StartupWMClass=MediaSort/' "$TARGET_DESKTOP"
            printf '\n%s\n' "MimeType=inode/directory;" >> "$TARGET_DESKTOP"

            # Mirror adjusted launcher to standard layout paths
            mkdir -p squashfs-root/usr/share/applications
            cp "$TARGET_DESKTOP" squashfs-root/usr/share/applications/MediaSort.desktop

            # Re-stage into a clean AppDir context and execute final compilation
            rm -rf dist
            mkdir -p dist
            mv squashfs-root dist/MediaSort.AppDir

            vpk pack -u MediaSort -v "$CLEAN_VERSION" -p "dist/MediaSort.AppDir" -e media-sort-gui --channel ${{ matrix.platform }} --runtime ${{ matrix.platform }}
          fi

      - name: Ensure GnuPG is installed
        if: success()
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          shell: bash
          command: |
            if ! command -v gpg &> /dev/null; then
              echo "gpg not found. Installing..."
              if [ "${{ matrix.os }}" = "macos-latest" ]; then
                brew install gnupg
              elif [ "${{ matrix.os }}" = "windows-latest" ] || [ "${{ matrix.os }}" = "windows-11-arm" ]; then
                choco install -y gnupg
              else
                sudo apt-get update && sudo apt-get install -y gnupg
              fi
            else
              echo "gpg is already installed: $(gpg --version | head -n 1)"
            fi

      - name: Import GPG Key
        if: success()
        # Pinned to the commit behind the v7 tag (2dc316de) so a retagged
        # mutable tag cannot silently change what the release pipeline runs
        # with the signing key in scope. Update deliberately after review.
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign Velopack Packages
        if: success()
        shell: bash
        run: |
          for file in Releases/*.nupkg; do
            echo "Signing $file..."
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
                --detach-sign \
                --output "${file}.sig" \
                "$file"
          done

      - name: Upload Velopack Packages to GitHub Draft Release
        if: success()
        shell: bash
        run: |
          RAW_VERSION="${{ github.ref_name }}"
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --channel ${{ matrix.platform }} --merge --tag "$RAW_VERSION" --token ${{ secrets.GITHUB_TOKEN }}

      - name: Upload GPG signatures to GitHub Draft Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" Releases/*.sig --clobber

  publish:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract Tag Message
        run: |
          TAG_TEXT=$(git tag -l --format='%(contents)' ${{ github.ref_name }} | sed '/-----BEGIN/,/-----END/d')
          if [ ! -z "$TAG_TEXT" ]; then
            echo "$TAG_TEXT" > CHANGES.md
            echo -e "\n\n## Changelog" >> CHANGES.md
          else
            touch CHANGES.md
          fi

      - name: Download git-cliff
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            # nick-fields/retry@v4 spawns the command without set -e; be
            # explicit so a failed download cannot silently pass.
            set -euo pipefail
            # nick-fields/retry@v4 runs `command` in a different working
            # directory than GITHUB_WORKSPACE and cannot honor
            # working-directory; extract into the workspace so the next
            # step can invoke ./git-cliff.
            cd "$GITHUB_WORKSPACE"
            curl -fL -o git-cliff.tar.gz https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz
            tar -xzf git-cliff.tar.gz --strip-components=1

      - name: Generate Changelog from Commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./git-cliff --config cliff.toml --current --strip header >> CHANGES.md

      - name: Merge Duplicate Releases for Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # External tooling occasionally creates more than one release for
        # a freshly pushed tag (GitHub renames the extra ones to
        # "untagged-*" URLs but keeps the same tag_name). velopack's
        # upload resolves the *newest* such release while gh resolves the
        # *oldest*, so the packages and the sig files can land on
        # different releases. By the time this step runs all deploy
        # uploads are complete, so the release set is final: move every
        # asset onto the oldest release (the one holding the real tag
        # URL) and delete the emptied duplicates. Nothing with assets is
        # ever deleted.
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          IDS="$(gh api --paginate "repos/$REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | sort -n)"
          COUNT="$(printf '%s\n' "$IDS" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$COUNT" -le 1 ]; then
            echo "single release for tag $TAG; nothing to merge"
            exit 0
          fi
          CANON="$(printf '%s\n' "$IDS" | head -n 1)"
          echo "::warning::$COUNT releases exist for tag $TAG; merging all assets into release $CANON"
          TMPDIR="$(mktemp -d)"
          gh api "repos/$REPO/releases/$CANON" --jq '.assets[].name' > "$TMPDIR/canon_assets.txt"
          printf '%s\n' "$IDS" | tail -n +2 | while read -r ID; do
            echo "::warning::merging assets from duplicate release $ID"
            gh api "repos/$REPO/releases/$ID" --jq '.assets[] | [.id, .name] | @tsv' | while read -r AID NAME; do
              if grep -Fqx "$NAME" "$TMPDIR/canon_assets.txt"; then
                echo "::warning::asset $NAME already on canonical release; skipping"
                continue
              fi
              echo "::warning::moving $NAME"
              # NOTE: api.github.com 404s asset uploads for draft releases
              # and gh api does not follow redirects, so use curl against
              # the uploads host and the redirect-following download URL.
              curl -fL -s -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/octet-stream" \
                "https://api.github.com/repos/$REPO/releases/assets/$AID" \
                -o "$TMPDIR/$NAME"
              curl -fL -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$TMPDIR/$NAME" \
                "https://uploads.github.com/repos/$REPO/releases/$CANON/assets?name=$NAME" \
                > /dev/null
              rm -f "$TMPDIR/$NAME"
              printf '%s\n' "$NAME" >> "$TMPDIR/canon_assets.txt"
            done
            gh api -X DELETE "repos/$REPO/releases/$ID"
          done
          rm -rf "$TMPDIR"
          echo "merge complete; single release $CANON for tag $TAG"

      - name: Insert Installer Download Table into Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Velopack uploads every full/delta package, its .sig and the update
        # manifests, so the release page's asset list buries the few files a
        # user actually wants to install. Slot a small table of direct download
        # links (from the same asset names the website's ReleaseDownloads
        # component shows) between the tag summary and the changelog, so the
        # right installer is obvious right below the intro.
        # At this point CHANGES.md is "<tag summary>\n\n## Changelog\n<git-cliff
        # output>" (the "Extract Tag Message" step adds the heading), so find
        # that heading and insert the table immediately before it.
        # Assets are final by now: every deploy upload and the duplicate-release
        # merge above have completed, so this reflects exactly what is published.
        #
        # NOTE: the release is still a DRAFT here (the "Publish Release
        # Atomically" step below flips it), and the
        # /releases/tags/{tag} endpoint never returns drafts — it 404s
        # regardless of authentication. Resolve the release through the
        # paginated /releases list instead (which does include drafts), the
        # same way the "Merge Duplicate Releases" step above does.
        # Draft assets also only have untagged-<hash> URLs, not tag URLs, so
        # rewrite the URL path to the canonical tag location the assets will
        # serve from once published — the notes go live in the same step that
        # publishes, so the links are valid from the first second they are
        # visible.
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          gh api --paginate "repos/$REPO/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .assets[] | [.name, .browser_download_url] | @tsv" \
            | sed -E "s#(releases/download/)[^/]+/?#\1$TAG/#" \
            | bash scripts/release-downloads.sh > DOWNLOADS.md
          if [ ! -s DOWNLOADS.md ]; then
            echo "no installer assets found; leaving release notes unchanged"
            exit 0
          fi
          if grep -q '^## Changelog$' CHANGES.md; then
            awk -v table=DOWNLOADS.md '
              !inserted && /^## Changelog$/ {
                while ((getline line < table) > 0) print line
                close(table)
                inserted = 1
              }
              { print }
            ' CHANGES.md > NOTES.md
          else
            # No tag summary was set (rare: scripts/release.sh always supplies
            # one), so there is no "## Changelog" heading to anchor to; the
            # table leads the notes instead.
            cat DOWNLOADS.md CHANGES.md > NOTES.md
          fi
          mv NOTES.md CHANGES.md

      - name: Publish Release Atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "All platforms compiled, signed, and merged. Publishing release..."
          RAW_VERSION="${{ github.ref_name }}"
          if [[ "$RAW_VERSION" == *"-"* ]]; then
            echo "Pre-release version detected. Publishing as pre-release..."
            gh release edit "$RAW_VERSION" --draft=false --prerelease --notes-file CHANGES.md
          else
            echo "Stable version detected. Publishing as stable release..."
            gh release edit "$RAW_VERSION" --draft=false --prerelease=false --latest --notes-file CHANGES.md
          fi
