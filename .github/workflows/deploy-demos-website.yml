name: Deploy Demos & Website

# Renders the demo flows and publishes the Astro site to GitHub Pages.
#
# The demo export is the expensive part (~3.4 min per video: 1080p60, x264
# crf=18, software Vulkan, debug build), and rendering all 7 flows x 3 locales
# sequentially took ~72 min of a single job's wall clock. The pipeline is
# therefore split so the work fans out:
#
#   plan     -- list the flow specs (one matrix entry per flow) and look up the
#               rendered-video cache
#   build-app-- compile the export binary ONCE and publish it as an artifact
#   render   -- one runner per flow, rendering that flow's 3 locales
#   assemble -- collect every video, build the site, publish the Pages artifact
#   deploy   -- deploy-pages
#
# The rendered videos are cached under a key over the inputs that determine
# them (the crates, the flow specs, the fixtures and this workflow file), so a
# run with unchanged inputs -- a re-dispatch after a transient failure, a
# docs-only release -- skips the compile and every render job and goes straight
# to `assemble`. The key is deliberately conservative: anything that could
# alter the bytes is a miss, and `workflow_dispatch`'s `force-render` input
# bypasses the lookup entirely. Only this workflow writes that cache.
#
# NOTE: the binary locates its fixtures through `resolve_workspace_path`, which
# is `env!("CARGO_MANIFEST_DIR")`-based -- i.e. the *compile-time* checkout
# path. Every job here uses the default checkout location, which is identical
# on GitHub-hosted runners (`/home/runner/work/<repo>/<repo>`), so the render
# jobs find `resources/MockState` where the build job compiled it. Do not
# override `path:` on checkout or run these jobs in a container with a
# different workspace, or the fixture lookup breaks.

on:
  workflow_run:
    workflows: ["Automated Release Distribution"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      force-render:
        description: 'Re-render the demo videos even if a matching cache exists'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: everything up to the deploy job only reads. The deploy job
# opts in to the Pages scopes only, and it runs no repository code.
permissions:
  contents: read

jobs:
  plan:
    # Run on workflow_dispatch or if the release workflow succeeded and it is a stable release (no '-' in the tag name)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_branch, '-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      flows: ${{ steps.list.outputs.flows }}
      render-key: ${{ steps.key.outputs.render-key }}
      demos-cached: ${{ steps.demos-cache.outputs.cache-hit }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List Demo Flows
        id: list
        run: |
          set -euo pipefail
          # One matrix entry per flow spec. Each render job renders every locale
          # for its flow, so adding or renaming a spec needs no edit here.
          flows=$(find resources/demo_flows -maxdepth 1 -name '*.json' -printf '%f\n' \
            | sed 's/\.json$//' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          [ -n "$flows" ] || { echo "::error::no demo flow specs found"; exit 1; }
          echo "flows=$flows" >> "$GITHUB_OUTPUT"
          echo "flows: $flows"

      - name: Compute Demo Render Key
        id: key
        run: |
          set -euo pipefail
          # Everything that determines the rendered bytes: the code being
          # demoed, the flow specs, the fixtures, and this workflow file (which
          # carries the render wiring). Any change to those is a cache miss.
          key="${{ hashFiles('crates/**', 'resources/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/deploy-demos-website.yml') }}"
          [ -n "$key" ] || { echo "::error::could not hash the demo inputs"; exit 1; }
          echo "render-key=$key" >> "$GITHUB_OUTPUT"
          echo "render-key: $key"

      - name: Look Up Rendered Demo Videos
        id: demos-cache
        # `force-render` only exists for workflow_dispatch; on a workflow_run the
        # input is absent and the lookup always runs.
        if: ${{ github.event.inputs.force-render != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/public/demos
          key: demos-${{ steps.key.outputs.render-key }}
          # Presence only: `assemble` performs the actual restore, so a hit here
          # does not download the videos twice.
          lookup-only: true

  build-app:
    needs: plan
    # Nothing to compile when the rendered videos are already cached.
    if: ${{ needs.plan.outputs.demos-cached != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust Environment
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Build Dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            sudo apt-get update
            # The `--export` demo build links the same native stack the test and
            # release jobs do, so keep this list in step with ci.yml/release.yml:
            #   libmpv-dev          video/GIF playback (bindgen uses the runner's
            #                       preinstalled libclang)
            #   libasound2-dev      ALSA, for audio output
            #   libdav1d-dev        AVIF decoding; without it `dav1d-sys` fails to
            #                       build (found via pkg-config)
            #   nasm                SIMD paths of the vendored libjpeg-turbo
            #   mesa-vulkan-drivers software Vulkan ICD for the headless wgpu
            #                       renderer (pulls in the libvulkan loader)
            #   ffmpeg              encodes the rendered demo videos
            sudo apt-get install -y libmpv-dev libasound2-dev libdav1d-dev nasm squashfs-tools ffmpeg mesa-vulkan-drivers

      - name: Build Demo Export Binary
        env:
          # A debug binary carries ~560 MB of debuginfo, which would be shipped
          # to (and re-downloaded by) every render job. `strip --strip-debug`
          # alone takes 723 MB -> 160 MB; dropping the debuginfo at build time
          # is smaller still and makes the link step cheaper.
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          set -euo pipefail
          cargo build -p media-sort-gui --features demo
          strip --strip-debug target/debug/media-sort-gui
          ls -la target/debug/media-sort-gui

      - name: Upload Demo Export Binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-sort-gui-demo
          path: target/debug/media-sort-gui
          retention-days: 1

  render:
    needs: [plan, build-app]
    if: ${{ needs.plan.outputs.demos-cached != 'true' }}
    runs-on: ubuntu-latest
    # ~3.4 min per video x 3 locales, with generous headroom for a slow runner.
    timeout-minutes: 45
    strategy:
      # One bad flow must not cancel the others; `assemble` refuses to publish a
      # partial set anyway.
      fail-fast: false
      matrix:
        flow: ${{ fromJSON(needs.plan.outputs.flows) }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Runtime Dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            sudo apt-get update
            # Runtime-only counterpart of the build job's list: nothing is
            # compiled here, so no nasm/libclang. ffmpeg encodes the video,
            # mesa-vulkan-drivers supplies the software Vulkan ICD the headless
            # renderer needs, and the -dev packages carry the shared libraries
            # the prebuilt binary links (libmpv, ALSA, dav1d).
            sudo apt-get install -y libmpv-dev libasound2-dev libdav1d-dev ffmpeg mesa-vulkan-drivers

      - name: Download Demo Export Binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: media-sort-gui-demo
          path: target/debug

      - name: Render ${{ matrix.flow }}
        run: |
          set -euo pipefail
          # Artifacts do not carry the executable bit.
          chmod +x target/debug/media-sort-gui
          # `--demo-spec` accepts a spec file or a directory; the directory
          # branch renders every locale for each spec in it, so a scratch dir
          # holding only this flow yields exactly this flow's de/en/ja videos.
          mkdir -p "$RUNNER_TEMP/specs"
          cp "resources/demo_flows/${{ matrix.flow }}.json" "$RUNNER_TEMP/specs/"
          target/debug/media-sort-gui --export \
            --demo-spec "$RUNNER_TEMP/specs" \
            --demo-export "$GITHUB_WORKSPACE/website/public/demos"
          ls -la website/public/demos

      - name: Upload Rendered Videos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demos-${{ matrix.flow }}
          path: website/public/demos/
          retention-days: 1

  assemble:
    needs: [plan, render]
    # `render` is skipped on a cache hit, and a skipped dependency skips this
    # job too unless the condition is explicit.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.render.result == 'success' || needs.render.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install Website Dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: cd website && npm ci

      - name: Collect Rendered Videos (cache hit)
        if: needs.plan.outputs.demos-cached == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/public/demos
          key: demos-${{ needs.plan.outputs.render-key }}

      - name: Collect Rendered Videos (render jobs)
        if: needs.plan.outputs.demos-cached != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: demos-*
          merge-multiple: true
          path: website/public/demos

      - name: Verify Demo Videos
        # Every flow x locale must be present: a render job that silently
        # produced nothing would otherwise publish a site with missing videos.
        run: |
          set -euo pipefail
          expected=$(( $(find resources/demo_flows -maxdepth 1 -name '*.json' | wc -l) \
                    * $(find resources/locale -mindepth 1 -maxdepth 1 -type d | wc -l) ))
          actual=$(find website/public/demos -maxdepth 1 -name '*.mp4' | wc -l)
          echo "expected $expected demo videos, found $actual"
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::expected $expected demo videos, found $actual"
            ls -la website/public/demos
            exit 1
          fi

      - name: Cache Rendered Videos
        # After the check above, so only a complete set is ever cached, and only
        # after a real render. A concurrent run may have created the same key
        # already, so a failed reservation is not fatal.
        if: needs.plan.outputs.demos-cached != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: website/public/demos
          key: demos-${{ needs.plan.outputs.render-key }}

      - name: Build Website
        run: npm run build
        working-directory: website
        env:
          # DownloadGrid/ReleaseDownloads resolve release assets with the gh
          # CLI at build time. gh refuses to run in Actions contexts without a
          # token, and the runner only injects GH_TOKEN when a step opts in.
          # The token is read-only here, so build-time code (dependencies,
          # plugins) cannot use it to push to the repository.
          GH_TOKEN: ${{ github.token }}

      - name: Upload Website as Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    needs: assemble
    # A skip propagates down the whole dependency chain ("a failure or skip
    # applies to all jobs in the dependency chain from the point of failure or
    # skip onwards"), so on a cache hit -- where `render` is skipped -- this job
    # is skipped too even though `assemble` succeeded. An explicit condition is
    # the documented escape hatch, and it is required: without it the run
    # reports success while publishing nothing.
    if: ${{ !cancelled() && needs.assemble.result == 'success' }}
    runs-on: ubuntu-latest
    # The environment GitHub Pages records the deployment against, and the
    # scope the deploy-pages OIDC token is issued for. Its branch policy must
    # allow the ref this workflow runs on (master, for both workflow_run and
    # workflow_dispatch).
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write    # create the Pages deployment
      id-token: write # OIDC token the Pages deployment API authenticates with

    steps:
      # deploy-pages reads the `github-pages` artifact this run uploaded; there
      # is nothing to check out or download.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
