name: CI Pipeline

on:
  push:
    branches: [master]
    paths-ignore:
      - 'website/**'
      - 'README.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'website/**'
      - 'README.md'
  merge_group:
    # Path filters are NOT supported for the merge_group event (they are
    # silently ignored), so merge-queue runs always execute every job.
    # Required checks must still report here or queued PRs block forever.
    branches: [master]
    types: [checks_requested]

# A new push to the same branch or PR supersedes the previous run; without
# this, rapid successive pushes each run their full 3-OS test matrix and
# compete for runner slots.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Cache trust model (applies to every actions/cache step in this workflow)
# -------------------------------------------------------------------------
# Cargo and bench-fixture caches are SAVED only by push runs on the branches
# listed under on.push.branches -- merged, reviewable code. Pull-request and
# merge-queue runs never write a cache entry (actions/cache/save is gated on
# github.event_name == 'push'), so untrusted code can never poison a cache
# entry that a later run consumes. GitHub already scopes PR-created caches to
# the PR merge ref; the explicit gate removes any dependence on that isolation
# continuing to hold.
#
# Nothing outside this workflow consumes these caches: release.yml restores
# no cache at all (see the note above its Build step), so signed/published
# artifacts are always built from checked-out source and cannot be influenced
# by a poisoned cache.

jobs:
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Clippy runs cargo check under the hood, so the dependency artifacts in
      # this cache are check-only metadata (.rmeta, no codegen). The test
      # matrix therefore keeps its own <os>-build-cargo-* namespace (see the
      # test job): sharing one key here used to let this job win every save
      # with an archive the build jobs could not reuse.
      # Restore-only on PRs/merge queue; see the cache trust model at the top.
      - name: Restore Cargo Cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-latest-cargo-

      - name: Install System Dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          # 60 min per attempt: the dpkg repair and the two apt calls below add
          # up to 47.5 min including their --kill-after windows, so the
          # action's timeout never fires -- and never runs its tree kill,
          # which rethrows the `EPERM` it hits on `sudo`'s child and aborts the
          # step instead of retrying.
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            # `set -e` because nick-fields/retry@v4 spawns the command without
            # it: only the last call's failure would otherwise reach the
            # action, so a failed `apt-get update` was swallowed (`install` is
            # last and did propagate). The cost of fixing that is a new red for
            # an update-only failure that cached package lists used to carry --
            # accepted, it is a real network failure.
            set -euo pipefail
            # A kill during unpack leaves dpkg's configure pass pending, after
            # which every later attempt refuses with "dpkg was interrupted".
            # `|| true` is safe: `apt-get install` below still decides the exit
            # status, so a genuinely broken package state is not hidden.
            timeout --kill-after=30 300 sudo dpkg --configure -a || true
            # Each apt call gets its own, shorter budget: a stalled mirror is
            # then killed by `timeout` (exit 124, an ordinary failure the
            # action retries) rather than by the action's timeout, whose tree
            # kill (tree-kill resolves the tree with `ps` and signals each pid)
            # rethrows the `EPERM` it hits on `sudo`'s child from the kill
            # callback -- uncaught, so the step aborts instead of retrying.
            timeout --kill-after=60 600 sudo apt-get update
            timeout --kill-after=60 1800 sudo apt-get install -y libmpv-dev libasound2-dev libdav1d-dev nasm

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        # Clippy flags the same issues on every OS, so run it once on Linux
        # instead of once per matrix entry -- but with every target and every
        # feature enabled so the single run still covers all code paths
        # (velopack, demo, headless, avif-native, ...).
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Save Cargo Cache
        # Trusted writers only (push on the branches above). Skipped when the
        # exact key already exists: a content-hash key cannot be refreshed,
        # so there would be nothing new to store.
        if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # Restore-only on PRs/merge queue; see the cache trust model at the top.
      # The build-cargo namespace is separate from the lint job's dependency
      # cache on purpose (see the lint job): clippy only produces check-only
      # metadata, so a shared key left this job rebuilding the whole
      # dependency tree on every run. The second restore key keeps the first
      # run after this change warm on macOS/Windows by falling back to the
      # archives the previous builds saved.
      - name: Restore Cargo Cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-build-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-build-cargo-
            ${{ matrix.os }}-cargo-

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          # 60 min per attempt: the dpkg repair and the two apt calls below add
          # up to 47.5 min including their --kill-after windows, so the
          # action's timeout never fires -- and never runs its tree kill,
          # which rethrows the `EPERM` it hits on `sudo`'s child and aborts the
          # step instead of retrying.
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            # `set -e` because nick-fields/retry@v4 spawns the command without
            # it: only the last call's failure would otherwise reach the
            # action, so a failed `apt-get update` was swallowed (`install` is
            # last and did propagate). The cost of fixing that is a new red for
            # an update-only failure that cached package lists used to carry --
            # accepted, it is a real network failure.
            set -euo pipefail
            # A kill during unpack leaves dpkg's configure pass pending, after
            # which every later attempt refuses with "dpkg was interrupted".
            # `|| true` is safe: `apt-get install` below still decides the exit
            # status, so a genuinely broken package state is not hidden.
            timeout --kill-after=30 300 sudo dpkg --configure -a || true
            # Each apt call gets its own, shorter budget: a stalled mirror is
            # then killed by `timeout` (exit 124, an ordinary failure the
            # action retries) rather than by the action's timeout, whose tree
            # kill (tree-kill resolves the tree with `ps` and signals each pid)
            # rethrows the `EPERM` it hits on `sudo`'s child from the kill
            # callback -- uncaught, so the step aborts instead of retrying.
            timeout --kill-after=60 600 sudo apt-get update
            timeout --kill-after=60 1800 sudo apt-get install -y libmpv-dev libasound2-dev libdav1d-dev nasm

      - name: Install System Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            brew install mpv dav1d
            echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Setup libmpv Link Libraries (Windows)
        if: matrix.os == 'windows-latest'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          # gh refuses to run without a token in Actions contexts; the
          # runner does not inject GH_TOKEN into action processes, only
          # run steps that reference github.token explicitly get one.
          GH_TOKEN: ${{ github.token }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          shell: bash
          command: |
            # nick-fields/retry@v4 spawns the command without set -e, so
            # failures would otherwise be swallowed and the step would
            # "succeed" with garbage artifacts; be explicit.
            set -euo pipefail
            # nick-fields/retry@v4 runs `command` in a different working
            # directory than GITHUB_WORKSPACE (it cannot honor
            # working-directory), so all paths must be absolute -- a
            # relative "libs" would not be found by the linker's
            # "/LIBPATH:libs" at build time.
            mkdir -p "$GITHUB_WORKSPACE/libs"
            # zhongfly/mpv-winbuild publishes a fresh build roughly daily but
            # retains only the last 30 days, so resolve the latest tag at
            # runtime instead of pinning one that would be pruned.
            RELEASE_SPEC="$(gh release view --repo zhongfly/mpv-winbuild --json tagName --jq .tagName)"
            [ -n "$RELEASE_SPEC" ] || { echo "::error::could not resolve mpv-winbuild release"; exit 1; }
            MPV_ASSET=$(gh release view "$RELEASE_SPEC" --repo zhongfly/mpv-winbuild --json assets --jq '.assets[].name | select(startswith("mpv-dev-x86_64") and endswith(".7z") and (contains("-lgpl") | not) and (contains("-v3") | not))' | head -n 1)
            [ -n "$MPV_ASSET" ] || { echo "::error::no mpv-dev-x86_64 asset in release $RELEASE_SPEC"; exit 1; }
            curl -fL -o mpv-dev.7z "https://github.com/zhongfly/mpv-winbuild/releases/download/$RELEASE_SPEC/$MPV_ASSET"
            7z e mpv-dev.7z libmpv-2.dll "-o$GITHUB_WORKSPACE/libs" -y
            7z e mpv-dev.7z libmpv.dll.a "-o$GITHUB_WORKSPACE/libs" -y
            mv "$GITHUB_WORKSPACE/libs/libmpv.dll.a" "$GITHUB_WORKSPACE/libs/mpv.lib"
            # Test binaries link libmpv-2.dll at load time; make it resolvable.
            # (cygpath: $PWD is POSIX-form in git-bash, which the Windows DLL
            # loader cannot use as a PATH entry.)
            echo "$(cygpath -w "$GITHUB_WORKSPACE")\\libs" >> "$GITHUB_PATH"

      - name: Setup dav1d/libjpeg-turbo Build Tools (Windows)
        if: matrix.os == 'windows-latest'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          shell: bash
          command: |
            pip install meson ninja
            choco install -y nasm pkgconfiglite

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: matrix.os == 'windows-latest'
        with:
          arch: x64

      # dav1d-sys 0.8.3's build script shells out to git/meson/ninja through a
      # helper that never inspects an exit status -- it only panics when the
      # process cannot be spawned -- so a failed clone or compile is silently
      # treated as success: cargo marks the build script fresh, no dav1d.lib
      # appears, and the link then dies with "LNK1181: cannot open input file
      # 'dav1d.lib'" (jobs 134899537045 and 137216198289). Because the clone
      # it repeats comes from code.videolan.org, retrying the compile step does
      # not clear it.
      #
      # So build the same static library here instead: the commit dav1d-sys
      # pins, fetched from github.com (which this runner can always reach),
      # with meson/ninja under `set -e` so a failure is loud and this step is
      # what gets retried, and the installed dav1d.lib asserted to exist.
      # system-deps is then pointed at the install tree, so the crate's build
      # script never runs git at all. NO_PKG_CONFIG skips the pkg-config probe
      # that cannot succeed on a runner with no .pc file -- which is what the
      # SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always this replaces forced instead.
      - name: Build dav1d (Windows)
        if: matrix.os == 'windows-latest'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 20
          shell: bash
          command: |
            set -euo pipefail
            # retry@v4 runs `command` in a different working directory than
            # GITHUB_WORKSPACE (it cannot honor working-directory).
            cd "$GITHUB_WORKSPACE"
            # meson resolves the MSVC linker by bare name, and git-bash puts
            # C:\Program Files\Git\usr\bin -- coreutils' `link.exe`, which is
            # not a linker -- ahead of the MSVC dirs, so `meson setup` dies
            # with "Found GNU link.exe instead of MSVC link.exe". Promote the
            # first PATH entry that really holds MSVC's linker, exactly as the
            # compile step below does for rustc. Doing it here rather than
            # through GITHUB_PATH is deliberate: bash re-prepends /usr/bin on
            # startup, so only an in-step export reorders the PATH that the
            # meson child actually sees.
            msvc_link_dir=""
            while IFS= read -r entry; do
              case "$entry" in
                ''|/usr/bin|/bin) continue ;;
              esac
              if [ -f "$entry/link.exe" ]; then
                msvc_link_dir="$entry"
                break
              fi
            done <<< "$(printf '%s\n' "$PATH" | tr ':' '\n')"
            [ -n "$msvc_link_dir" ] \
              || { echo "::error::no MSVC linker found on PATH"; exit 1; }
            export PATH="$msvc_link_dir:$PATH"
            # Name the compiler explicitly instead of letting meson resolve one
            # from PATH. That keeps ccache/sccache -- the image ships ccache in
            # C:\Strawberry\c\bin -- out of build.ninja, so the log shows the
            # compiler that actually ran; with CC set meson parses the entry
            # rather than probing for a cache.
            CC_WIN="$(cygpath -w "$msvc_link_dir")/cl.exe"
            [ -f "$CC_WIN" ] || { echo "::error::$CC_WIN not found"; exit 1; }
            export CC="$CC_WIN"
            # 1.5.5, not the 1.5.0 that dav1d-sys 0.8.3 pins (nor 1.5.4, which
            # is what 0.9.0 moves to): 1.5.5 is the first tag whose
            # compat/msvc/stdatomic.h survives MSVC 14.52.37029, which rejects
            # the `#if defined(__clang__) && __has_include_next(<stdatomic.h>)`
            # guard with "error C7780: function-like macro
            # '__has_include_next' is not defined" on earlier tags; 1.5.5
            # defines the macro away before the guard. include/dav1d/version.h
            # is byte-identical to 1.5.0's, so the crate's bindings are
            # unaffected. DAV1D_COMMIT is the tag's peeled sha, so the archive
            # cannot move under us the way a tag can.
            DAV1D_TAG=1.5.5
            DAV1D_COMMIT=6c7bee685677fd997a431302be4fea8ea4017606
            # The prefix is a stable absolute path, because it is baked into
            # the build script's cached rustc-link-search that a restored
            # target/ reuses, and it carries the commit so that bumping the
            # pin changes SYSTEM_DEPS_DAV1D_SEARCH_NATIVE/INCLUDE and re-runs
            # the system-deps probe instead of being absorbed by a warm cache.
            prefix="$GITHUB_WORKSPACE/dav1d-static-$DAV1D_COMMIT"
            rm -rf "$prefix" dav1d-src dav1d-build dav1d.tar.gz
            curl -fsSL -o dav1d.tar.gz \
              "https://github.com/videolan/dav1d/archive/$DAV1D_COMMIT.tar.gz"
            mkdir dav1d-src
            tar xzf dav1d.tar.gz -C dav1d-src --strip-components=1
            grep -q "version: '$DAV1D_TAG'" dav1d-src/meson.build \
              || { echo "::error::$DAV1D_COMMIT is not dav1d $DAV1D_TAG"; exit 1; }
            meson setup -Ddefault_library=static --prefix "$prefix" \
              dav1d-build dav1d-src
            ninja -C dav1d-build
            meson install -C dav1d-build
            lib="$prefix/lib/dav1d.lib"
            if [ ! -f "$lib" ]; then
              # meson installs the MSVC static archive as `libdav1d.a` (its
              # static-library suffix is `.a` for every compiler), while
              # link.exe resolves `-l dav1d` as `dav1d.lib` -- which is what
              # "LNK1181: cannot open input file 'dav1d.lib'" was all along.
              # The archive is plain COFF either way, so copy it to the name the
              # Rust link asks for.
              built="$prefix/lib/libdav1d.a"
              [ -f "$built" ] \
                || { echo "::error::neither $lib nor $built was installed"; exit 1; }
              cp "$built" "$lib"
            fi
            {
              echo "SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=never"
              echo "SYSTEM_DEPS_DAV1D_NO_PKG_CONFIG=1"
              echo "SYSTEM_DEPS_DAV1D_LIB=dav1d"
              echo "SYSTEM_DEPS_DAV1D_LINK=static"
              echo "SYSTEM_DEPS_DAV1D_SEARCH_NATIVE=$prefix/lib"
              echo "SYSTEM_DEPS_DAV1D_INCLUDE=$prefix/include"
            } >> "$GITHUB_ENV"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: nextest

      - name: Restore Bench Fixtures
        id: fixtures-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/media-sort-fixtures
          # Keyed on the generator + the source image: any change misses and
          # regenerates. The code also self-validates via the VERSION marker.
          key: ${{ matrix.os }}-fixtures-${{ hashFiles('crates/benchmarks/src/fixture_gen.rs', 'resources/MockState/mock 1.jpg') }}

      # Compiling is split from executing so that only the compile is retried:
      # a toolchain flake in the cargo build, a network flake fetching crates,
      # or a retried libjpeg-turbo build is retried, while a genuine test
      # failure still fails the run below immediately instead of being retried
      # until it looks green. dav1d is already built by the step above, so this
      # only consumes that install tree.
      - name: Build Test Binaries (retry on transient network failures)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          # Keep in sync with the test and doctest steps below: RUSTFLAGS is
          # part of cargo's fingerprint, so a copy that disagrees silently
          # turns their run into a full rebuild.
          LIBRARY_PATH: ${{ matrix.os == 'macos-latest' && '/opt/homebrew/lib' || '' }}
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-L native=libs -C link-arg=/NODEFAULTLIB:LIBCMTD -C link-arg=/NODEFAULTLIB:LIBCMT' || '' }}
        with:
          # Bounds each attempt, three attempts in total: a cold build compiles
          # the whole workspace including the vendored libjpeg-turbo sources.
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 20
          shell: bash
          # Runs before every retry, never after the last attempt. retry@v4
          # executes it through execSync with the platform default shell
          # (cmd.exe on Windows, /bin/sh elsewhere) rather than the `shell:`
          # setting above, so the cleanup is handed to bash explicitly:
          # `set -euo pipefail` is not cmd syntax, and cmd.exe would pass
          # `$GITHUB_WORKSPACE` through literally instead of expanding it. A
          # failure here is reported through the action's info() channel and
          # cannot fail the step. `cargo clean -p dav1d-sys` is what counts: it
          # drops the build script's fingerprint so the system-deps probe runs
          # again against the prebuilt library.
          on_retry_command: |
            bash -c "set -euo pipefail; cd \"$GITHUB_WORKSPACE\"; cargo clean -p dav1d-sys"
          command: |
            # nick-fields/retry@v4 spawns the command without set -e, so a
            # failed compile would otherwise be swallowed; be explicit.
            set -euo pipefail
            # retry@v4 runs `command` in a different working directory than
            # GITHUB_WORKSPACE (it cannot honor working-directory).
            cd "$GITHUB_WORKSPACE"
            # git-bash puts its own /usr/bin -- where coreutils' `link.exe`
            # lives -- ahead of the MSVC dirs, and rustc resolves MSVC's
            # linker by bare name (see the NOTE on the nextest step below), so
            # promote the first PATH entry that really holds MSVC's linker.
            # No-op on Linux/macOS, where no such entry exists.
            if [ "${RUNNER_OS:-}" = "Windows" ]; then
              msvc_link_dir=""
              while IFS= read -r entry; do
                case "$entry" in
                  ''|/usr/bin|/bin) continue ;;
                esac
                if [ -f "$entry/link.exe" ]; then
                  msvc_link_dir="$entry"
                  break
                fi
              done <<< "$(printf '%s\n' "$PATH" | tr ':' '\n')"
              if [ -n "$msvc_link_dir" ]; then
                export PATH="$msvc_link_dir:$PATH"
              fi
            fi
            # --no-run compiles every workspace test binary (the same
            # selection, profile and RUSTFLAGS as the test step) and runs
            # nothing, so the flake is retried here and never around a test.
            cargo nextest run --workspace --no-run

      - name: Run Workspace Tests
        env:
          # Keep in sync with the build and doctest steps' env (see above and
          # below); a mismatched RUSTFLAGS rebuilds the workspace here.
          LIBRARY_PATH: ${{ matrix.os == 'macos-latest' && '/opt/homebrew/lib' || '' }}
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-L native=libs -C link-arg=/NODEFAULTLIB:LIBCMTD -C link-arg=/NODEFAULTLIB:LIBCMT' || '' }}
        # nextest runs each test in its own process, so the previous Windows
        # split (exclude the GUI crate, then rerun it serially to work around
        # a parallel access-violation crash) is no longer needed -- the same
        # command works on all OSes. Bench targets (divan, harness=false)
        # are skipped, matching the old `--tests` selection.
        # NOTE: keep the default shell. Under git-bash, /usr/bin precedes the
        # MSVC dirs in PATH and rustc invokes GNU coreutils' `link` instead of
        # MSVC link.exe.
        run: cargo nextest run --workspace

      - name: Run Doctests
        env:
          # Keep in sync with the build and test steps' env above; a
          # mismatched RUSTFLAGS rebuilds the workspace here.
          LIBRARY_PATH: ${{ matrix.os == 'macos-latest' && '/opt/homebrew/lib' || '' }}
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-L native=libs -C link-arg=/NODEFAULTLIB:LIBCMTD -C link-arg=/NODEFAULTLIB:LIBCMT' || '' }}
        # cargo-nextest does not run doctests, and the old `--tests` selection
        # skipped them too -- run them explicitly so this coverage is gained
        # rather than lost by the switch.
        run: cargo test --workspace --doc

      - name: Save Bench Fixtures
        # Trusted writers only; see the cache trust model at the top.
        if: ${{ github.event_name == 'push' && steps.fixtures-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/media-sort-fixtures
          key: ${{ steps.fixtures-cache.outputs.cache-primary-key }}

      - name: Exclude Bench Fixtures From Cargo Cache
        # The fixtures live inside target/ and are persisted by their own cache
        # entry; leaving their ~330 MB copy in the Cargo archive would pay for
        # the same bytes twice on every OS within the repo-wide 10 GB cache
        # budget. Runs after the fixture save, before the Cargo save.
        if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: rm -rf target/media-sort-fixtures

      - name: Save Cargo Cache
        # Trusted writers only; see the cache trust model at the top. Skipped
        # when the exact key already exists: a content-hash key cannot be
        # refreshed, so there would be nothing new to store.
        if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  verify-contributors:
    name: Verify Contributors List
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify PR Author in contributors.json
        # Automation accounts (renovate[bot], dependabot[bot], app/renovate, ...)
        # are not contributors and must not be required to appear in
        # contributors.json.
        if: >-
          github.event_name == 'pull_request' &&
          !endsWith(github.event.pull_request.user.login, '[bot]') &&
          !startsWith(github.event.pull_request.user.login, 'app/')
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          echo "Checking if contributor '$AUTHOR' is listed in contributors.json..."
          if jq -e --arg user "$AUTHOR" '.[] | select(.github == $user)' contributors.json > /dev/null; then
            echo "Success: '$AUTHOR' is listed in contributors.json."
          else
            echo "::error::PR author '$AUTHOR' is not listed in contributors.json! Please add yourself to the contributors.json file at the root of the repository."
            exit 1
          fi
